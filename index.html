<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ACE Register</title>
<meta name="theme-color" content="#1E1547" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ACE Register" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div id="splashScreen">
  <img src="./logo-small.png" alt="ACE Skills" id="splashLogo" />
  <div id="splashTitle">ACE SKILLS DEVELOPMENT CENTER</div>
  <div id="splashBar"><div id="splashBarFill"></div></div>
</div>

<header class="cover">
  <div class="cover-inner">
    <div>
      <div class="brand">
        <img src="./logo-small.png" alt="ACE Skills logo" style="width:34px;height:34px;border-radius:6px;background:#fff" />
        <h1>ACE SKILLS DEVELOPMENT CENTER</h1>
      </div>
      <p class="tagline">Lead & Student Register — IELTS · PTE · Spoken English</p>
    </div>
    <div class="header-actions">
      <div class="theme-switch" id="themeSwitch">
        <button class="theme-opt" id="themeDefault" title="Default">&#127912;</button>
        <button class="theme-opt" id="themeLight" title="White">&#9728;&#65039;</button>
        <button class="theme-opt" id="themeDark" title="Black">&#127769;</button>
      </div>
      <span id="authArea"></span>
      <button class="btn btn-ghost-dark" id="soundBtn">&#128266; Sound</button>
      <button class="btn btn-ghost-dark" id="pushBtn">&#128276; Notify Me</button>
      <span id="offlineBadge" style="display:none"></span>
      <button class="btn btn-ghost-dark" id="scheduleBtn">&#128197; Slots</button>
      <button class="btn btn-ghost-dark" id="attendanceBtn">&#128337; Attendance</button>
      <button class="btn btn-ghost-dark" id="dashboardBtn">&#128202; Dashboard</button>
      <button class="btn btn-ghost-dark" id="targetsBtn">&#127919; Targets</button>
      <button class="btn btn-ghost-dark" id="customizeBtn">&#9881;&#65039; Customize</button>
      <button class="btn btn-ghost-dark" id="exportBtn">&#11015;&#65039; Export</button>
      <button class="btn btn-brass" id="addBtn">&#65291; Add Entry</button>
    </div>
  </div>
</header>

<main>
  <div id="saveError" class="save-error" style="display:none"></div>
  <div id="bannerHost"></div>
  <div id="weeklyHost"></div>
  <div class="stats" id="statsRow"></div>
  <div class="toolbar" id="toolbar"></div>
  <div id="recordsWrap"></div>
</main>

<div id="modalHost"></div>
<div id="settingsHost"></div>
<div id="scheduleHost"></div>
<div id="attendanceHost"></div>
<div id="dashboardHost"></div>
<div id="targetsHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./app.js"></script>
</body>
</html>
